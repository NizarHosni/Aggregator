services:
  - type: web
    name: yodoc-backend
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm run start:server
    healthCheckPath: /api/health
    # Note: PORT is automatically set by Render (default: 10000)
    envVars:
      - key: NODE_ENV
        value: production
      # Required environment variables (set these in Render dashboard):
      # - DATABASE_URL (from Neon PostgreSQL)
      # - JWT_SECRET
      # - OPENAI_API_KEY
      # - GOOGLE_PLACES_API_KEY (optional)
      # - STRIPE_SECRET_KEY (optional, for subscriptions)
      # - STRIPE_PREMIUM_PRICE_ID (optional)
      # - STRIPE_PREMIUM_PRODUCT_ID (optional)
      # - STRIPE_WEBHOOK_SECRET (optional)
      # - SMTP_HOST (optional, for email)
      # - SMTP_PORT (optional)
      # - SMTP_USER (optional)
      # - SMTP_PASS (optional)
      # - EMAIL_FROM (optional)
      # - FRONTEND_URL (your Netlify frontend URL)
      # - CLIENT_URL (same as FRONTEND_URL)
      # - ALLOWED_ORIGINS (comma-separated list of allowed origins)

